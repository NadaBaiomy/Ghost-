<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050810">
  <title>Ghost</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Reem+Kufi+Fun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg:#050810;--ac:#00e676;--or:#ff6b35;--dn:#ff1744;--gd:#ffd740;--gc:#b0b4c8;--cd:#0c1220;--bd:#1a2436;--tx:#d8dce8;--mt:#5a6a80;--wall:#0f1520;--floor:#080c14}
    *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);user-select:none;-webkit-user-select:none;touch-action:manipulation}
    .scr{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .5s}
    .scr.on{display:flex;opacity:1}

    /* ===== قائمة ===== */
    #menu{background:radial-gradient(ellipse at 50% 40%,#0a1020,var(--bg) 75%)}
    .mpc{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .mp{position:absolute;width:2px;height:2px;background:var(--gc);border-radius:50%;opacity:0;animation:mpd 8s linear infinite}
    @keyframes mpd{0%{opacity:0;transform:translateY(0)}15%{opacity:.22}85%{opacity:.08}100%{opacity:0;transform:translateY(-180px)}}
    .menu-ghost{width:160px;height:200px;margin-bottom:20px;opacity:.85;filter:drop-shadow(0 0 30px rgba(180,185,210,.15));animation:mfloat 4s ease-in-out infinite}
    @keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .mt1{font-family:'Reem Kufi Fun',sans-serif;font-size:clamp(52px,14vw,90px);color:#c8cce0;letter-spacing:14px;text-shadow:0 0 60px rgba(200,204,224,.12),0 4px 0 rgba(80,85,110,.3);margin-bottom:6px}
    .mt2{font-size:clamp(13px,2.8vw,17px);color:var(--mt);margin-bottom:44px;letter-spacing:3px;font-weight:300}
    .btn{border:none;border-radius:12px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:all .25s}
    .bp{background:linear-gradient(135deg,var(--ac),#00c853);color:#050810;font-size:19px;padding:16px 60px;min-width:220px;letter-spacing:1px}
    .bp:hover{transform:scale(1.06);box-shadow:0 0 36px rgba(0,230,118,.25)}.bp:active{transform:scale(.95)}

    /* ===== مقدمة ===== */
    #intro{background:var(--bg);padding:20px}
    .ibx{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:36px;max-width:440px;width:92%;text-align:center}
    .ilv{color:var(--ac);font-size:11px;font-weight:700;letter-spacing:6px;margin-bottom:12px;text-transform:uppercase}
    .inm{font-size:32px;font-weight:900;margin-bottom:8px;letter-spacing:1px}

    .gwrap{display:flex;justify-content:center;margin:18px 0}
    .gchar-lg{position:relative;width:90px;height:120px;animation:gfloat 3.5s ease-in-out infinite}
    @keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .ghead-lg{width:78px;height:66px;margin:0 auto;position:relative;background:radial-gradient(ellipse at 50% 35%,rgba(200,205,225,.72),rgba(140,145,170,.18));border-radius:50% 50% 40% 40%;box-shadow:0 0 28px rgba(180,185,210,.12),0 0 60px rgba(180,185,210,.06)}
    .geye-lg{position:absolute;width:14px;height:16px;background:#0a0618;border-radius:50%;top:22px;overflow:hidden;transition:all .3s}
    .geye-lg.l{left:16px}.geye-lg.r{right:16px}
    .gpup-lg{width:6px;height:7px;background:var(--dn);border-radius:50%;margin:4px auto;box-shadow:0 0 8px rgba(255,23,68,.6);transition:all .3s}
    .gmou-lg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:10px;height:6px;background:#0a0618;border-radius:50%;transition:all .3s}
    .gtail-lg{width:78px;height:34px;margin:-4px auto 0;background:linear-gradient(180deg,rgba(180,185,210,.28),rgba(140,145,170,.04));clip-path:polygon(0% 0%,100% 0%,100% 55%,84% 100%,68% 55%,52% 100%,36% 55%,20% 100%,0% 55%);filter:blur(1px)}

    /* ===== اللعبة ===== */
    #game{justify-content:flex-start;background:var(--bg)}
    .hud{width:100%;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(6,10,18,.92);border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0;z-index:20;backdrop-filter:blur(8px)}
    .hl{font-weight:700;color:var(--ac);font-size:14px}.hg{font-size:13px;color:var(--mt);font-weight:700}
    .hr{display:flex;align-items:center;gap:10px}
    .hf{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mt)}
    .ft{width:90px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
    .ff{height:100%;width:0%;border-radius:3px;transition:width .6s;background:linear-gradient(90deg,var(--or),var(--dn))}
    .sb{background:none;border:1px solid var(--bd);color:var(--mt);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .sb:hover{border-color:var(--ac);color:var(--ac)}

    /* ===== الغرفة ===== */
    .rwrap{flex:1;width:100%;position:relative;overflow:hidden}
    .room{position:absolute;inset:4px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.02)}
    .rw{position:absolute;top:0;width:100%;height:60%;transition:background .6s}
    .rf{position:absolute;bottom:0;width:100%;height:40%;border-top:1px solid rgba(255,255,255,.03)}
    .rfl{position:absolute;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
    /* أرضية خشبية */
    .rf-wood{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(255,255,255,.012) 48px,rgba(255,255,255,.012) 49px),repeating-linear-gradient(0deg,transparent,transparent 120px,rgba(255,255,255,.008) 120px,rgba(255,255,255,.008) 121px);pointer-events:none}
    /* جدار خشن */
    .rw-texture{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 20px,rgba(255,255,255,.005) 20px,rgba(255,255,255,.005) 21px);pointer-events:none}

    /* نافذة */
    .window-frame{position:absolute;z-index:4;pointer-events:none}
    .window-glass{width:100%;height:100%;background:linear-gradient(180deg,rgba(20,30,55,.6),rgba(10,15,30,.8));border:2px solid rgba(80,90,110,.3);border-radius:2px;box-shadow:inset 0 0 20px rgba(40,60,100,.15)}
    .window-cross-v{position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(80,90,110,.25);transform:translateX(-50%)}
    .window-cross-h{position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(80,90,110,.25);transform:translateY(-50%)}
    .moonlight{position:absolute;z-index:2;pointer-events:none;background:linear-gradient(160deg,rgba(60,80,140,.06),transparent 60%);border-radius:0 0 0 80%}

    /* أثاث */
    .furn{position:absolute;z-index:3;pointer-events:none}
    .furn-shadow{position:absolute;bottom:-4px;left:10%;width:80%;height:6px;background:rgba(0,0,0,.3);border-radius:50%;filter:blur(3px)}

    /* تأثيرات الغرفة */
    .rv{position:absolute;inset:0;pointer-events:none;z-index:13;background:radial-gradient(ellipse at 50% 50%,transparent 25%,rgba(5,8,16,.82) 100%)}
    .rfg{position:absolute;bottom:0;width:200%;height:50px;z-index:12;pointer-events:none;background:linear-gradient(to top,rgba(5,8,16,.55),transparent);animation:fgd 25s linear infinite}
    @keyframes fgd{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .rdst{position:absolute;inset:0;z-index:11;pointer-events:none}
    .dst{position:absolute;width:1.5px;height:1.5px;background:rgba(200,204,224,.12);border-radius:50%;animation:df 10s ease-in-out infinite}
    @keyframes df{0%,100%{transform:translate(0,0);opacity:.06}25%{transform:translate(8px,-14px);opacity:.18}75%{transform:translate(12px,-20px);opacity:.12}}

    /* ثيمات الغرف */
    .tm .rw{background:linear-gradient(180deg,#12101c,#16131f,#1a1724)}
    .tm .rf{background:linear-gradient(180deg,#0e1018,#080b12)}
    .tl .rw{background:linear-gradient(180deg,#10140f,#141c14,#182018)}
    .tl .rf{background:linear-gradient(180deg,#0c100e,#080c0a)}
    .tv .rw{background:linear-gradient(180deg,#181010,#1e1414,#221818)}
    .tv .rf{background:linear-gradient(180deg,#100c0c,#0c0808)}
    .tbs .rw{background:linear-gradient(180deg,#0e1014,#121618,#161c1e)}
    .tbs .rf{background:linear-gradient(180deg,#0a0c10,#060810)}
    .tbo .rw{background:linear-gradient(180deg,#120a18,#1a0e22,#200e28)}
    .tbo .rf{background:linear-gradient(180deg,#0e080e,#08060c)}

    /* ===== الشبح ===== */
    .ge{position:absolute;z-index:8;cursor:pointer;transition:left 1.8s ease,top 1.8s ease}
    .ge .gchar-lg{width:80px;height:110px}
    .ge .ghead-lg{width:68px;height:58px}
    .ge .geye-lg{width:12px;height:14px;top:18px}.ge .geye-lg.l{left:14px}.ge .geye-lg.r{right:14px}
    .ge .gpup-lg{width:5px;height:6px}
    .ge .gtail-lg{width:68px;height:30px}
    .gsh{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:50px;height:8px;background:rgba(0,0,0,.15);border-radius:50%;filter:blur(4px)}
    /* حالة الخوف */
    .ge.scared .geye-lg{width:16px;height:18px;top:14px}
    .ge.scared .gpup-lg{width:7px;height:8px;background:#ff5252;box-shadow:0 0 12px rgba(255,82,82,.8)}
    .ge.scared .gmou-lg{width:14px;height:10px;bottom:6px}
    .ge.scared .ghead-lg{animation:gsk .08s ease-in-out infinite}
    .ge.scared .gchar-lg{filter:drop-shadow(0 0 18px rgba(255,23,68,.2))}
    @keyframes gsk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    .ge.amused .geye-lg{height:8px;top:20px}
    .ge.amused .gmou-lg{width:12px;height:3px;bottom:10px;border-radius:3px 3px 0 0}
    .ge.annoyed .geye-lg{height:7px;top:20px}
    .ge.annoyed .gmou-lg{width:6px;height:2px;bottom:12px}
    .ge.fleeing .gchar-lg{animation:gfl .15s ease-in-out infinite}
    .ge.fleeing .geye-lg{width:14px;height:18px;top:12px}
    .ge.fleeing .gmou-lg{width:16px;height:10px;bottom:4px}
    .ge.fleeing{transition:left .35s ease,top .35s ease}
    @keyframes gfl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(6deg)}}
    .ge.gone{display:none}
    /* أثر طيفي */
    .gtrail{position:absolute;z-index:7;pointer-events:none;border-radius:50%;background:rgba(180,185,210,.08);animation:trailf 1.2s ease forwards}
    @keyframes trailf{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3) translateY(-10px)}}

    .gwhisp{position:absolute;z-index:9;font-size:12px;color:rgba(200,204,224,.25);pointer-events:none;animation:gwhp 2.8s ease forwards;white-space:nowrap;font-style:italic;font-weight:300}
    @keyframes gwhp{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}80%{opacity:.3}100%{opacity:0;transform:translateY(-30px)}}

    /* ===== اللاعب ===== */
    .pl{position:absolute;z-index:7;transition:left .55s ease,top .55s ease;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
    .pl i{font-size:36px;color:#e0e0e0}

    /* ===== الأجسام ===== */
    .ro{position:absolute;z-index:6;cursor:pointer;transition:transform .2s,filter .2s}
    .ro:hover{transform:scale(1.1) translateY(-3px);filter:brightness(1.25)}
    .ro:active{transform:scale(.9)}
    .oic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:all .3s;position:relative;overflow:hidden}
    .oic::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 50%);pointer-events:none}
    .ro:hover .oic{box-shadow:0 6px 22px rgba(0,0,0,.5)}
    .olb{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mt);white-space:nowrap;background:rgba(5,8,16,.8);padding:2px 7px;border-radius:4px;pointer-events:none;font-weight:700;letter-spacing:.3px}
    .ro.col{display:none}
    .ro.hid{display:none}
    .ro.rev{display:block;animation:orv .45s ease}
    @keyframes orv{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
    .ro.rattle .oic{animation:ratl .4s ease}
    @keyframes ratl{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

    .ecto{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(0,230,118,.35);box-shadow:0 0 14px rgba(0,230,118,.25);z-index:9;pointer-events:none;animation:ecta 1.6s ease forwards}
    @keyframes ecta{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-24px)}}

    .dring{position:absolute;border:2px solid var(--gd);border-radius:50%;z-index:14;pointer-events:none;animation:drng 1.1s ease forwards}
    @keyframes drng{0%{opacity:1;width:10px;height:10px}100%{opacity:0;width:140px;height:140px}}

    /* ===== المخزن ===== */
    .inv{width:100%;min-height:66px;padding:8px 12px;background:rgba(6,10,18,.92);border-top:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:6px;flex-shrink:0;z-index:20;overflow-x:auto;backdrop-filter:blur(8px)}
    .invl{font-size:11px;color:var(--mt);white-space:nowrap;margin-left:6px}
    .islt{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--cd);border:2px solid var(--bd);cursor:pointer;transition:all .2s;flex-shrink:0;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.25)}
    .islt:hover{border-color:var(--ac);transform:scale(1.08)}
    .islt.sel{border-color:var(--ac);background:rgba(0,230,118,.06);box-shadow:0 0 16px rgba(0,230,118,.2)}
    .isn{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--mt);white-space:nowrap;font-family:'Cairo',sans-serif}
    .ie{color:var(--mt);font-size:12px;opacity:.25}

    /* ===== حوار ===== */
    .dlg{position:absolute;z-index:18;background:rgba(12,18,30,.94);border:1px solid var(--bd);border-radius:14px;padding:10px 18px;max-width:70%;font-size:13px;line-height:1.6;text-align:center;animation:dlgI .3s ease;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
    @keyframes dlgI{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* ===== تنبيهات ===== */
    .tbc{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:5px;align-items:center;max-width:95vw}
    .tst{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 16px;font-size:13px;animation:tstI .3s ease;text-align:center;max-width:92vw;backdrop-filter:blur(6px)}
    .tst.disc{border-color:var(--gd);background:rgba(255,215,64,.06);color:var(--gd);font-weight:700;box-shadow:0 0 24px rgba(255,215,64,.08)}
    .tst.ok{border-color:var(--ac);background:rgba(0,230,118,.06);color:var(--ac)}
    .tst.err{border-color:var(--dn);background:rgba(255,23,68,.05);color:var(--dn)}
    @keyframes tstI{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

    /* ===== تأثيرات ===== */
    .fxfl{position:absolute;inset:0;z-index:14;pointer-events:none;animation:fxflA .6s ease forwards}
    @keyframes fxflA{0%{background:rgba(255,215,64,.12)}50%{background:rgba(255,215,64,.02)}100%{background:transparent}}
    .fxw{position:absolute;inset:0;z-index:14;pointer-events:none;animation:fxwA 1.2s ease forwards}
    @keyframes fxwA{0%{background:rgba(0,230,118,.08)}50%{background:rgba(0,230,118,.02)}100%{background:transparent}}
    .sshk{animation:shkA .35s ease}
    @keyframes shkA{0%,100%{transform:translate(0)}25%{transform:translate(-3px,3px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-3px,3px)}}
    .bglw{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,59,.18),transparent 70%);pointer-events:none;z-index:5;animation:bglwA 1.5s ease-in-out infinite}
    @keyframes bglwA{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}

    /* ===== نتائج ===== */
    #lc,#gc{background:var(--bg);padding:20px}
    .lcb,.gcb{background:var(--cd);border-radius:18px;padding:32px;max-width:420px;width:92%;text-align:center}
    .lcb{border:1px solid rgba(0,230,118,.3);box-shadow:0 0 30px rgba(0,230,118,.06)}
    .gcb{border:1px solid rgba(0,230,118,.4);box-shadow:0 0 40px rgba(0,230,118,.08)}
    .lct{font-size:24px;font-weight:900;color:var(--ac);margin-bottom:8px}
    .lcw{font-size:15px;color:var(--gd);margin:8px 0}
    .lcd{color:var(--mt);font-size:13px;line-height:1.7;margin-bottom:20px}
    .gct{font-size:28px;font-weight:900;color:var(--ac);margin-bottom:10px}
    .gcg{display:flex;justify-content:center;gap:12px;margin:16px 0;flex-wrap:wrap}
    .gci{background:rgba(0,0,0,.3);border-radius:14px;padding:10px;font-size:12px;color:var(--mt);min-width:80px}
    .gci .gn{font-weight:700;display:block;margin-bottom:3px}
    .gci .gf{color:var(--gd);font-size:11px}

    /* ===== شمعة متوهجة ===== */
    .candle-glow{position:absolute;z-index:4;pointer-events:none;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,30,.06),transparent 70%);animation:cglow 2s ease-in-out infinite alternate}
    @keyframes cglow{0%{opacity:.6;transform:scale(1)}100%{opacity:1;transform:scale(1.15)}}

    /* ===== شبكة العنكبوت ===== */
    .cobweb{position:absolute;z-index:4;pointer-events:none;opacity:.08}

    @media(max-width:500px){.oic{width:44px;height:44px;font-size:18px}.ge .gchar-lg{width:64px;height:88px}.ge .ghead-lg{width:56px;height:48px}.ge .geye-lg{width:10px;height:11px;top:14px}.pl i{font-size:30px}.islt{width:38px;height:38px;font-size:16px}}
  </style>
</head>
<body>

<div id="menu" class="scr on">
  <div class="mpc" id="mpc"></div>
  <div id="menuGhost"></div>
  <div class="mt1">GHOST</div>
  <div class="mt2">الشبح اللي بيخاف منك</div>
  <button class="btn bp" id="playBtn"><i class="fas fa-ghost"></i>&nbsp; يلا</button>
</div>

<div id="intro" class="scr"><div class="ibx" id="ibx"></div></div>

<div id="game" class="scr">
  <div class="hud">
    <div class="hl" id="hl"></div>
    <div class="hg" id="hg"></div>
    <div class="hr">
      <div class="hf"><span>خوف</span><div class="ft"><div class="ff" id="ffl"></div></div><span id="fpc">0%</span></div>
      <button class="sb" id="sbtn"><i class="fas fa-volume-up"></i></button>
    </div>
  </div>
  <div class="rwrap" id="rwr"><div class="room" id="room"></div></div>
  <div class="inv" id="inv"><span class="invl"><i class="fas fa-briefcase"></i></span><span class="ie">فاضي</span></div>
</div>

<div id="lc" class="scr"><div class="lcb" id="lcb"></div></div>
<div id="gc" class="scr"><div class="gcb" id="gcb"></div></div>
<div class="tbc" id="tbc"></div>

  for(var i=0;i<12;i++){var d=document.createElement("div");d.className="dst";d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";d.style.animationDelay=Math.random()*10+"s";d.style.animationDuration=(7+Math.random()*7)+"s";dc.appendChild(d)}

  /* أثاث */
  var furns=FURN[l.th]||[];
  for(var fi=0;fi<furns.length;fi++){
    var f=furns[fi],fe=document.createElement("div");fe.className="furn";
    fe.style.left=f.x+"%";fe.style.top=f.y+"%";fe.style.width=f.w+"%";fe.style.height=f.h+"%";
    fe.style.cssText+=(";"+f.css);
    /* ظل */
    var fsh=document.createElement("div");fsh.className="furn-shadow";
    fe.appendChild(fsh);
    rm.appendChild(fe);
  }

  /* نافذة */
  var win=WINS[l.th];
  if(win){
    var wf=document.createElement("div");wf.className="window-frame";
    wf.style.left=win.x+"%";wf.style.top=win.y+"%";wf.style.width=win.w+"%";wf.style.height=win.h+"%";
    wf.innerHTML='<div class="window-glass"><div class="window-cross-v"></div><div class="window-cross-h"></div></div>';
    rm.appendChild(wf);
    /* ضوء قمر */
    var ml=document.createElement("div");ml.className="moonlight";
    ml.style.left=(win.x-5)+"%";ml.style.top=win.y+"%";
    ml.style.width=(win.w+30)+"%";ml.style.height=(win.h+40)+"%";
    rm.appendChild(ml);
  }

  /* شبكة عنكبوت - زاوية */
  var cw=document.createElement("div");cw.className="cobweb";
  cw.style.right="0";cw.style.top="0";cw.style.width="60px";cw.style.height="60px";
  cw.innerHTML='<svg viewBox="0 0 60 60" fill="none" stroke="rgba(200,204,224,.5)" stroke-width=".5"><line x1="60" y1="0" x2="30" y2="10"/><line x1="60" y1="0" x2="20" y2="20"/><line x1="60" y1="0" x2="10" y2="30"/><line x1="60" y1="0" x2="0" y2="40"/><path d="M40 5 Q35 12 30 10 Q25 15 20 20 Q15 25 10 30 Q5 35 0 40"/></svg>';
  rm.appendChild(cw);

  /* ضوء شمعة (لو في شمعة في الغرفة) */
  var hasCandle=false;
  for(var ci=0;ci<l.o.length;ci++){if(l.o[ci].id==="candle"&&!l.o[ci].hid){hasCandle=true;break}}
  if(hasCandle){
    var cg=document.createElement("div");cg.className="candle-glow";cg.id="candleGlow";
    /* هنحركها مع الشمعة */
    for(var ci2=0;ci2<l.o.length;ci2++){if(l.o[ci2].id==="candle"){cg.style.left=(l.o[ci2].x-2)+"%";cg.style.top=(l.o[ci2].y-5)+"%";break}}
    rm.appendChild(cg);
  }

  /* أجسام تفاعلية */
  for(var j=0;j<l.o.length;j++){
    var o=l.o[j],ic=IC[o.id]||{i:"fa-circle",c:"#888",b:"rgba(136,136,136,.08)"};
    var e=document.createElement("div");e.className="ro";
    if(o.hid)e.classList.add("hid");
    e.id="o-"+o.id;e.style.left=o.x+"%";e.style.top=o.y+"%";
    var lb=NM[o.id]||"";
    e.innerHTML='<div class="oic" style="background:'+ic.b+";color:"+ic.c+'"><i class="fa-solid '+ic.i+'"></i></div><span class="olb">'+lb+"</span>";
    (function(obj){e.addEventListener("click",function(ev){ev.stopPropagation();clickO(obj)})})(o);
    rm.appendChild(e);
  }

  /* شبح */
  var gh=document.createElement("div");gh.className="ge";gh.id="gh";
  gh.style.left=G.gP.x+"%";gh.style.top=G.gP.y+"%";
  gh.innerHTML='<div class="gchar-lg"><div class="ghead-lg"><div class="geye-lg l"><div class="gpup-lg"></div></div><div class="geye-lg r"><div class="gpup-lg"></div></div><div class="gmou-lg"></div></div><div class="gtail-lg"></div></div><div class="gsh"></div>';
  gh.addEventListener("click",function(ev){ev.stopPropagation();clickG()});
  rm.appendChild(gh);

  /* لاعب */
  var pl=document.createElement("div");pl.className="pl";pl.id="pl";
  pl.style.left=G.pP.x+"%";pl.style.top=G.pP.y+"%";
  pl.innerHTML='<i class="fa-solid fa-person-dress"></i>';
  rm.appendChild(pl);

  renderI();
}

function updF(){document.getElementById("ffl").style.width=G.fear+"%";document.getElementById("fpc").textContent=G.fear+"%"}

function renderI(){
  var b=document.getElementById("inv");
  b.innerHTML='<span class="invl"><i class="fas fa-briefcase"></i></span>';
  if(!G.inv.length){b.innerHTML+='<span class="ie">فاضي</span>';return}
  for(var i=0;i<G.inv.length;i++){
    var it=G.inv[i],ic=IC[it.id]||{i:"fa-circle",c:"#888",b:"rgba(136,136,136,.08)"};
    var s=document.createElement("div");s.className="islt";
    if(G.sel===it.id)s.classList.add("sel");
    s.style.background=ic.b;s.style.color=ic.c;
    s.innerHTML='<i class="fa-solid '+ic.i+'"></i><span class="isn">'+it.nm+"</span>";
    (function(item){s.addEventListener("click",function(){G.sel=G.sel===item.id?null:item.id;renderI()})})(it);
    b.appendChild(s);
  }
}

function moveP(x,y,cb){var pl=document.getElementById("pl");if(!pl)return;G.pP={x:x,y:y};pl.style.left=x+"%";pl.style.top=y+"%";S.st();if(cb)setTimeout(cb,550)}

/* ===== أثر الشبح ===== */
function startTrail(){
  stopTrail();
  G.trailI=setInterval(function(){
    if(G.gone)return;
    if(!G.lastGP||Math.abs(G.lastGP.x-G.gP.x)<1&&Math.abs(G.lastGP.y-G.gP.y)<1)return;
    G.lastGP={x:G.gP.x,y:G.gP.y};
    var rm=document.getElementById("room");if(!rm)return;
    var t=document.createElement("div");t.className="gtrail";
    t.style.left=(G.gP.x+2)+"%";t.style.top=(G.gP.y+5)+"%";
    t.style.width="20px";t.style.height="20px";
    rm.appendChild(t);setTimeout(function(){t.remove()},1200);
  },300);
}
function stopTrail(){if(G.trailI){clearInterval(G.trailI);G.trailI=null}}

/* ===== نقر جسم ===== */
function clickO(o){
  var l=LV[G.lv];
  if(o.hid){var e=document.getElementById("o-"+o.id);if(!e||!e.classList.contains("rev"))return}
  if(G.sel){useOnO(o);return}
  moveP(o.x,Math.min(o.y+14,82),function(){
    if(o.op&&o.con&&!G.rS[o.id+"_o"]){
      G.rS[o.id+"_o"]=true;var h=null;
      for(var k=0;k<l.o.length;k++){if(l.o[k].id===o.con){h=l.o[k];break}}
      if(h){reveal(h);toast("لقتي حاجة!","ok");S.pk()}return;
    }
    if(o.col){if(o.brk&&!G.camF){toast(o.bt,"err");rattle(o.id);return}collect(o);return}
    if(o.ni){rattle(o.id);return}
    if(o.it){showDlg(o.it)}
  });
}

function collect(o){var nm=NM[o.id]||o.id;G.inv.push({id:o.id,nm:nm});var e=document.getElementById("o-"+o.id);if(e)e.classList.add("col");S.pk();renderI()}
function reveal(o){var e=document.getElementById("o-"+o.id);if(e){e.classList.remove("hid");e.classList.add("rev")}}
function rattle(id){var e=document.getElementById("o-"+id);if(e){e.classList.add("rattle");setTimeout(function(){e.classList.remove("rattle")},400)}}

/* ===== نقر شبح ===== */
function clickG(){
  if(G.gone)return;
  if(!G.sel){var l=LV[G.lv];showDlg(l.g.n+": هههه 😈");S.wo();var nx=Math.min(88,Math.max(10,G.gP.x+(Math.random()-.5)*20));var ny=Math.min(68,Math.max(10,G.gP.y+(Math.random()-.5)*15));moveG(nx,ny);return}
  useOnG();
}

function useOnG(){
  var l=LV[G.lv],it=null;
  for(var i=0;i<G.inv.length;i++){if(G.inv[i].id===G.sel){it=G.inv[i];break}}
  if(!it)return;
  moveP(Math.min(88,Math.max(10,G.gP.x+(Math.random()>.5?14:-14))),Math.min(82,G.gP.y+10),function(){
    if(G.sel===l.g.wid)useW(it);else useWr(it,l);
    G.sel=null;renderI();
  });
}

function useW(it){
  var l=LV[G.lv];G.fear=Math.min(100,G.fear+35);updF();dropEcto();
  if(!G.disc){
    G.disc=true;S.dc();
    var rm=document.getElementById("room"),fl=document.createElement("div");fl.className="fxfl";rm.appendChild(fl);setTimeout(function(){fl.remove()},600);
    var ring=document.createElement("div");ring.className="dring";ring.style.left=G.gP.x+"%";ring.style.top=G.gP.y+"%";rm.appendChild(ring);setTimeout(function(){ring.remove()},1100);
    toast(l.g.dt,"disc");setM("scared");showDlg(l.g.n+": لا لا لا! 😱");moveGA();
  }else{
    S.sc();if(G.fear>=100){ghostFled();return}
    setM("scared");
    var r=[l.g.n+": تاني?! 😨",l.g.n+": أوف! 😱",l.g.n+": ههرب! 🏃"];
    showDlg(r[Math.min(2,Math.floor(G.fear/35))]);moveGA();
    var rw=document.getElementById("rwr");rw.classList.add("sshk");setTimeout(function(){rw.classList.remove("sshk")},350);
  }
}

function useWr(it,l){
  S.wr();var rx=l.g.r[it.id]||{t:l.g.n+": إيه ده? 😐",m:"neutral"};
  showDlg(rx.t);setM(rx.m||"neutral");
  setTimeout(function(){if(!G.disc)setM("neutral");else if(G.fear>30)setM("scared")},2200);
  moveG(Math.min(88,Math.max(10,G.gP.x+(Math.random()-.5)*28)),Math.min(68,Math.max(10,G.gP.y+(Math.random()-.5)*18)));
}

/* ===== استخدام على جسم ===== */
function useOnO(o){
  var l=LV[G.lv],it=null;
  for(var i=0;i<G.inv.length;i++){if(G.inv[i].id===G.sel){it=G.inv[i];break}}
  if(!it)return;
  if(l.id===2&&G.sel==="catfood"&&o.id==="bowl"){
    G.sel=null;G.inv=G.inv.filter(function(x){return x.id!=="catfood"});
    var catObj=null;for(var k=0;k<l.o.length;k++){if(l.o[k].id==="cat"){catObj=l.o[k];break}}
    if(catObj)reveal(catObj);toast("القطة طلعت!","ok");S.pk();renderI();moveP(o.x,Math.min(o.y+14,82));return;
  }
  if(l.id===3&&G.sel==="batteries"&&o.id==="camera"){
    G.sel=null;G.inv=G.inv.filter(function(x){return x.id!=="batteries"});G.camF=true;
    var camObj=null;for(var k2=0;k2<l.o.length;k2++){if(l.o[k2].id==="camera"){camObj=l.o[k2];break}}
    if(camObj){camObj.brk=0}collect(camObj);toast("الكاميرا اشتغلت!","ok");S.dc();renderI();moveP(o.x,Math.min(o.y+14,82));return;
  }
  if(l.id===4&&G.sel==="wire"&&o.id==="switch_b"){
    G.sel=null;G.inv=G.inv.filter(function(x){return x.id!=="wire"});G.rS["pwr"]=true;
    toast("الكهرباء رجعت!","ok");S.dc();lightB();renderI();moveP(o.x,Math.min(o.y+14,82));return;
  }
  if(o.ni===G.sel){
    G.sel=null;G.inv=G.inv.filter(function(x){return x.id!==o.ni});
    toast("استخدمتيها!","ok");S.pk();
    if(l.id===2&&o.id==="bowl"){var co=null;for(var k3=0;k3<l.o.length;k3++){if(l.o[k3].id==="cat"){co=l.o[k3];break}}if(co)reveal(co)}
    renderI();moveP(o.x,Math.min(o.y+14,82));return;
  }
  showDlg("مش هينفع 🤔");S.wr();rattle(o.id);G.sel=null;renderI();
}

/* ===== لمبات ===== */
function lightB(){
  var ids=["bulb1","bulb2","bulb3"],rm=document.getElementById("room");
  for(var idx=0;idx<ids.length;idx++){
    (function(i){
      setTimeout(function(){
        var e=document.getElementById("o-"+ids[i]);
        if(e){var ic=e.querySelector(".oic");if(ic){ic.style.background="rgba(255,235,59,.15)";ic.style.color="#ffeb3b";ic.style.boxShadow="0 0 20px rgba(255,235,59,.35)"}var gl=document.createElement("div");gl.className="bglw";gl.style.left=(parseFloat(e.style.left)-1)+"%";gl.style.top=(parseFloat(e.style.top)-5)+"%";rm.appendChild(gl)}
        G.bulbs=i+1;
        if(i===2){
          setTimeout(function(){
            var hasLight=false;for(var j=0;j<G.inv.length;j++){if(G.inv[j].id==="light"){hasLight=true;break}}
            if(!hasLight){G.inv.push({id:"light",nm:"ضوء"});renderI()}
            G.disc=true;G.fear=Math.min(100,G.fear+35);updF();
            toast("Whispy بيخاف من الضوء!","disc");S.dc();setM("scared");
            var fl=document.createElement("div");fl.className="fxfl";rm.appendChild(fl);setTimeout(function(){fl.remove()},600);
            showDlg("النور! أوف! 😨");moveGA();
          },500);
        }
      },i*500);
    })(idx);
  }
}

/* ===== إكتوبلازم ===== */
function dropEcto(){
  var rm=document.getElementById("room");
  for(var i=0;i<5;i++){
    var e=document.createElement("div");e.className="ecto";
    e.style.left=(G.gP.x+Math.random()*12-6)+"%";
    e.style.top=(G.gP.y+Math.random()*10-2)+"%";
    e.style.animationDelay=(i*.12)+"s";
    rm.appendChild(e);(function(el){setTimeout(function(){el.remove()},1600)})(e);
  }
}

/* ===== همسات ===== */
var WHISPS=["...boo","هههه","go away","...","مفيش حاجة تخوف","اتريكي","...cold...","لا تقربي"];
function startWhisp(){
  if(G.wI)return;
  G.wI=setInterval(function(){
    if(G.gone||G.mood==="fleeing")return;
    var rm=document.getElementById("room");if(!rm)return;
    var w=document.createElement("div");w.className="gwhisp";
    w.textContent=WHISPS[Math.floor(Math.random()*WHISPS.length)];
    w.style.left=(G.gP.x+6)+"%";w.style.top=(G.gP.y-10)+"%";
    rm.appendChild(w);setTimeout(function(){w.remove()},2800);
  },3800);
}

/* ===== هروب ===== */
function ghostFled(){
  var l=LV[G.lv];G.gone=true;setM("fleeing");S.wn();moveG(92,58);
  setTimeout(function(){var g=document.getElementById("gh");if(g)g.classList.add("gone")},500);
  var rm=document.getElementById("room"),fx=document.createElement("div");fx.className="fxw";rm.appendChild(fx);setTimeout(function(){fx.remove()},1200);
  toast(l.st,"ok");setTimeout(showLC,2400);
}

function showLC(){
  var l=LV[G.lv],ic=IC[l.g.wid]||{i:"fa-circle",c:"#888"},b=document.getElementById("lcb");
  b.innerHTML='<div class="lct">مبروك</div><div style="font-size:44px;color:'+ic.c+';margin:12px 0;opacity:.8"><i class="fa-solid '+ic.i+'"></i></div><div class="lcw">'+l.g.n+" بيخاف من "+l.g.wn+'</div><div class="lcd">'+l.st+'</div><button class="btn bp" id="nxtBtn"><i class="fas fa-forward"></i>&nbsp; '+(G.lv<LV.length-1?"التالي":"النتيجة")+"</button>";
  showScr("lc");
  document.getElementById("nxtBtn").addEventListener("click",nxt);
}

function nxt(){if(G.lv<LV.length-1){G.lv++;stopAI();stopWhisp();stopTrail();showIntro()}else showGC()}

function showGC(){
  stopAI();stopWhisp();stopTrail();var b=document.getElementById("gcb"),gh="";
  for(var i=0;i<LV.length;i++){var l=LV[i],ic=IC[l.g.wid]||{i:"fa-circle",c:"#888"};gh+='<div class="gci"><i class="fa-solid '+ic.i+'" style="color:'+ic.c+';font-size:24px;display:block;margin-bottom:5px;opacity:.8"></i><span class="gn">'+l.g.n+'</span><div class="gf">بيخاف من '+l.g.wn+"</div></div>"}
  b.innerHTML='<div class="gct">كسبتي</div><div class="gcg">'+gh+'</div><button class="btn bp" id="rpBtn" style="margin-top:16px"><i class="fas fa-redo"></i>&nbsp; تاني</button>';
  showScr("gc");S.wn();
  document.getElementById("rpBtn").addEventListener("click",startGame);
}

/* ===== ذكاء شبح ===== */
function startAI(){stopAI();G.gI=setInterval(aiT,2200)}
function stopAI(){if(G.gI){clearInterval(G.gI);G.gI=null}}
function stopWhisp(){if(G.wI){clearInterval(G.wI);G.wI=null}}

function aiT(){
  if(G.gone||G.mood==="fleeing")return;
  var nx,ny;
  if(G.fear>60){var dx=G.gP.x-G.pP.x,dy=G.gP.y-G.pP.y,d=Math.sqrt(dx*dx+dy*dy)||1;nx=G.gP.x+(dx/d)*20+(Math.random()-.5)*12;ny=G.gP.y+(dy/d)*16+(Math.random()-.5)*10}
  else if(G.fear>0){nx=G.gP.x+(Math.random()-.5)*18;ny=G.gP.y+(Math.random()-.5)*12}
  else{nx=G.gP.x+(Math.random()-.5)*30;ny=G.gP.y+(Math.random()-.5)*20}
  nx=Math.min(88,Math.max(8,nx));ny=Math.min(68,Math.max(8,ny));moveG(nx,ny);
  if(Math.random()<.12)S.wo();
}

function moveG(x,y){G.gP={x:x,y:y};var g=document.getElementById("gh");if(g){g.style.left=x+"%";g.style.top=y+"%"}}
function moveGA(){var dx=G.gP.x-G.pP.x,dy=G.gP.y-G.pP.y,d=Math.sqrt(dx*dx+dy*dy)||1;moveG(Math.min(88,Math.max(8,G.gP.x+(dx/d)*26)),Math.min(68,Math.max(8,G.gP.y+(dy/d)*20)))}

function setM(m){
  G.mood=m;var g=document.getElementById("gh");if(!g)return;
  g.classList.remove("scared","amused","annoyed","fleeing");
  if(m==="scared")g.classList.add("scared");
  else if(m==="amused")g.classList.add("amused");
  else if(m==="annoyed")g.classList.add("annoyed");
  else if(m==="fleeing")g.classList.add("fleeing");
}

/* ===== حوار ===== */
function showDlg(t){
  var rm=document.getElementById("room");
  var old=rm.querySelectorAll(".dlg");for(var i=0;i<old.length;i++)old[i].remove();
  clearTimeout(G.dTO);
  var d=document.createElement("div");d.className="dlg";d.textContent=t;
  d.style.bottom="82px";d.style.left="50%";d.style.transform="translateX(-50%)";
  rm.appendChild(d);G.dTO=setTimeout(function(){d.remove()},3000);
}

/* ===== تنبيه ===== */
function toast(t,tp){
  tp=tp||"";var c=document.getElementById("tbc"),e=document.createElement("div");
  e.className="tst "+tp;e.textContent=t;c.appendChild(e);
  setTimeout(function(){e.style.opacity="0";e.style.transition="opacity .3s";setTimeout(function(){e.remove()},300)},tp==="disc"?3800:2400);
}

/* ===== أحداث ===== */
document.getElementById("playBtn").addEventListener("click",startGame);
document.getElementById("sbtn").addEventListener("click",function(){
  S.ut=!S.ut;if(S.mg)S.mg.gain.value=S.ut?0:.35;
  var b=document.getElementById("sbtn");
  b.innerHTML=S.ut?'<i class="fas fa-volume-xmark"></i>':'<i class="fas fa-volume-up"></i>';
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){G.sel=null;renderI()}});
</script>
</body>
</html>
