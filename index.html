<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050a0f">
  <title>Ghost - الشبح اللي بيخاف منك</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Creepster&family=Lemonada:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg:#050a0f;--ac:#00e676;--ac2:#00c853;--or:#ff6b35;--dn:#ff1744;--gd:#ffd740;--gc:#b0b4c8;--cd:#0a1018;--bd:#162030;--tx:#d8dce8;--mt:#4a5a70;--pk:#ff80ab}
    *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);user-select:none;-webkit-user-select:none;touch-action:manipulation}
    .scr{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .5s;z-index:1}
    .scr.on{display:flex;opacity:1}

    /* ===== المنيو ===== */
    #menu{background:var(--bg);overflow:hidden}
    .menu-bg{position:absolute;inset:0;pointer-events:none}
    .menu-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(0,230,118,.03),transparent 60%)}
    .menu-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(10,20,35,.8),transparent 70%)}
    .mpc{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .mp{position:absolute;width:2px;height:2px;background:var(--gc);border-radius:50%;opacity:0;animation:mpd 9s linear infinite}
    @keyframes mpd{0%{opacity:0;transform:translateY(0)}12%{opacity:.15}88%{opacity:.04}100%{opacity:0;transform:translateY(-200px)}}

    .menu-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:20px}

    .menu-ghost-wrap{margin-bottom:12px;animation:mfloat 4s ease-in-out infinite}
    @keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .menu-ghost-svg{width:140px;height:175px;filter:drop-shadow(0 0 30px rgba(200,204,224,.08))}

    .menu-title-en{font-family:'Creepster',cursive;font-size:clamp(22px,5.5vw,38px);color:var(--ac);letter-spacing:3px;text-shadow:0 0 20px rgba(0,230,118,.15);text-align:center;line-height:1.2;margin-bottom:2px}
    .menu-title-ar{font-family:'Cairo',sans-serif;font-size:clamp(15px,3.5vw,22px);color:var(--tx);font-weight:700;letter-spacing:1px;text-align:center;margin-bottom:28px;opacity:.7}

    .menu-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
    .btn{border:none;border-radius:12px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:all .25s;letter-spacing:.5px}
    .bp{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#050a0f;font-size:18px;padding:14px 52px;min-width:220px}
    .bp:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(0,230,118,.2)}.bp:active{transform:scale(.95)}
    .bs{background:transparent;border:1px solid var(--bd);color:var(--mt);font-size:14px;padding:10px 40px;min-width:220px}
    .bs:hover{border-color:var(--mt);color:var(--tx);transform:scale(1.03)}

    .menu-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mt);opacity:.4;letter-spacing:1px}

    /* ===== شرح ===== */
    #howto{background:var(--bg);padding:20px;overflow-y:auto}
    .howto-box{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;max-width:420px;width:92%;text-align:start}
    .howto-title{font-size:22px;font-weight:900;color:var(--ac);text-align:center;margin-bottom:16px}
    .howto-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
    .howto-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .howto-text{font-size:13px;line-height:1.7;color:var(--tx)}
    .howto-text strong{color:var(--gd)}
    .howto-back{margin-top:18px;display:flex;justify-content:center}

    /* ===== مقدمة ===== */
    #intro{background:var(--bg);padding:20px}
    .ibx{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:32px;max-width:420px;width:92%;text-align:center}
    .ilv{color:var(--ac);font-size:10px;font-weight:700;letter-spacing:6px;margin-bottom:8px}
    .inm{font-size:28px;font-weight:900;margin-bottom:4px}
    .isub{color:var(--mt);font-size:12px;font-weight:300}

    .gwrap{display:flex;justify-content:center;margin:16px 0}
    .gchar-lg{position:relative;width:76px;height:100px;animation:gfloat 3.2s ease-in-out infinite}
    @keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .ghead-lg{width:64px;height:54px;margin:0 auto;position:relative;background:radial-gradient(ellipse at 50% 35%,rgba(195,200,220,.6),rgba(130,135,160,.1));border-radius:50% 50% 40% 40%;box-shadow:0 0 22px rgba(180,185,210,.08)}
    .geye-lg{position:absolute;width:12px;height:14px;background:#0a0618;border-radius:50%;top:17px;overflow:hidden;transition:all .3s}
    .geye-lg.l{left:13px}.geye-lg.r{right:13px}
    .gpup-lg{width:5px;height:6px;background:var(--dn);border-radius:50%;margin:3px auto;box-shadow:0 0 6px rgba(255,23,68,.5);transition:all .3s}
    .gmou-lg{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:8px;height:5px;background:#0a0618;border-radius:50%;transition:all .3s}
    .gtail-lg{width:64px;height:28px;margin:-2px auto 0;background:linear-gradient(180deg,rgba(175,180,205,.2),rgba(130,135,160,.02));clip-path:polygon(0% 0%,100% 0%,100% 55%,84% 100%,68% 55%,52% 100%,36% 55%,20% 100%,0% 55%);filter:blur(1px)}

    /* ===== اللعبة ===== */
    #game{justify-content:flex-start;background:var(--bg)}
    .hud{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(5,10,15,.88);border-bottom:1px solid rgba(255,255,255,.03);flex-shrink:0;z-index:20}
    .hl{font-weight:700;color:var(--ac);font-size:12px}.hg{font-size:11px;color:var(--mt);font-weight:700}
    .hr{display:flex;align-items:center;gap:8px}
    .hf{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mt)}
    .ft{width:80px;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
    .ff{height:100%;width:0%;border-radius:3px;transition:width .6s;background:linear-gradient(90deg,var(--or),var(--dn))}
    .sb{background:none;border:1px solid var(--bd);color:var(--mt);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .sb:hover{border-color:var(--ac);color:var(--ac)}

    .rwrap{flex:1;width:100%;position:relative;overflow:hidden}
    .room{position:absolute;inset:4px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.02)}
    .rw{position:absolute;top:0;width:100%;height:60%;transition:background .6s}
    .rf{position:absolute;bottom:0;width:100%;height:40%;border-top:1px solid rgba(255,255,255,.03)}
    .rfl{position:absolute;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent)}
    .rf-wood{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 44px,rgba(255,255,255,.008) 44px,rgba(255,255,255,.008) 45px);pointer-events:none}
    .rw-texture{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 16px,rgba(255,255,255,.003) 16px,rgba(255,255,255,.003) 17px);pointer-events:none}
    .window-frame{position:absolute;z-index:4;pointer-events:none}
    .window-glass{width:100%;height:100%;background:linear-gradient(180deg,rgba(16,24,44,.5),rgba(6,12,24,.7));border:2px solid rgba(60,70,90,.2);border-radius:2px;box-shadow:inset 0 0 14px rgba(30,50,80,.1)}
    .window-cross-v{position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(60,70,90,.18);transform:translateX(-50%)}
    .window-cross-h{position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(60,70,90,.18);transform:translateY(-50%)}
    .moonlight{position:absolute;z-index:2;pointer-events:none;background:linear-gradient(160deg,rgba(40,60,100,.04),transparent 50%);border-radius:0 0 0 60%}
    .furn{position:absolute;z-index:3;pointer-events:none}
    .furn-shadow{position:absolute;bottom:-3px;left:10%;width:80%;height:5px;background:rgba(0,0,0,.2);border-radius:50%;filter:blur(2px)}
    .rv{position:absolute;inset:0;pointer-events:none;z-index:13;background:radial-gradient(ellipse at 50% 50%,transparent 20%,rgba(5,10,15,.78) 100%)}
    .rfg{position:absolute;bottom:0;width:200%;height:40px;z-index:12;pointer-events:none;background:linear-gradient(to top,rgba(5,10,15,.45),transparent);animation:fgd 22s linear infinite}
    @keyframes fgd{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .rdst{position:absolute;inset:0;z-index:11;pointer-events:none}
    .dst{position:absolute;width:1.5px;height:1.5px;background:rgba(200,204,224,.08);border-radius:50%;animation:df 10s ease-in-out infinite}
    @keyframes df{0%,100%{transform:translate(0,0);opacity:.04}25%{transform:translate(6px,-10px);opacity:.12}75%{transform:translate(9px,-16px);opacity:.08}}

    .tm .rw{background:linear-gradient(180deg,#10101a,#14111d,#171420)}.tm .rf{background:linear-gradient(180deg,#0c0e14,#07090e)}
    .tl .rw{background:linear-gradient(180deg,#0d120c,#111912,#141c14)}.tl .rf{background:linear-gradient(180deg,#090c0a,#060908)}
    .tv .rw{background:linear-gradient(180deg,#140d0d,#1a1010,#1e1414)}.tv .rf{background:linear-gradient(180deg,#0c0909,#080606)}
    .tbs .rw{background:linear-gradient(180deg,#0a0c10,#0e1214,#121818)}.tbs .rf{background:linear-gradient(180deg,#070a0c,#04060c)}
    .tbo .rw{background:linear-gradient(180deg,#0e0714,#160a1e,#1c0a24)}.tbo .rf{background:linear-gradient(180deg,#0a060a,#06040a)}

    .ge{position:absolute;z-index:8;cursor:pointer;transition:left 1.6s ease,top 1.6s ease}
    .ge .gchar-lg{width:72px;height:95px}.ge .ghead-lg{width:60px;height:50px}.ge .geye-lg{width:10px;height:12px;top:15px}.ge .geye-lg.l{left:12px}.ge .geye-lg.r{right:12px}.ge .gpup-lg{width:4px;height:5px}.ge .gtail-lg{width:60px;height:26px}
    .gsh{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:40px;height:6px;background:rgba(0,0,0,.1);border-radius:50%;filter:blur(3px)}
    .ge.scared .geye-lg{width:16px!important;height:18px!important;top:11px!important;animation:eyePop .3s ease}
    @keyframes eyePop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1.15)}}
    .ge.scared .gpup-lg{width:6px;height:7px;background:#ff5252;box-shadow:0 0 12px rgba(255,82,82,.8)}
    .ge.scared .gmou-lg{width:14px!important;height:10px!important;bottom:3px!important}
    .ge.scared .ghead-lg{animation:gsk .07s ease-in-out infinite}
    .ge.scared .gchar-lg{filter:drop-shadow(0 0 18px rgba(255,23,68,.15));animation:scaredBounce .15s ease-in-out infinite}
    @keyframes scaredBounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(2deg)}}
    @keyframes gsk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    .ge.amused .geye-lg{height:6px;top:18px}.ge.amused .gmou-lg{width:12px;height:3px;bottom:8px;border-radius:3px 3px 0 0}
    .ge.annoyed .geye-lg{height:5px;top:18px}.ge.annoyed .gmou-lg{width:6px;height:2px;bottom:10px}
    .ge.fleeing .gchar-lg{animation:gfl .12s ease-in-out infinite}.ge.fleeing .geye-lg{width:14px!important;height:16px!important;top:10px!important}.ge.fleeing .gmou-lg{width:16px!important;height:10px!important;bottom:1px!important}.ge.fleeing{transition:left .3s ease,top .3s ease}
    @keyframes gfl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(7deg)}}
    .ge.gone{display:none}
    .gtrail{position:absolute;z-index:7;pointer-events:none;border-radius:50%;background:rgba(175,180,210,.05);animation:trailf 1s ease forwards}
    @keyframes trailf{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.2) translateY(-8px)}}
    .gwhisp{position:absolute;z-index:9;font-size:11px;color:rgba(200,204,224,.18);pointer-events:none;animation:gwhp 2.5s ease forwards;white-space:nowrap;font-style:italic;font-weight:300}
    @keyframes gwhp{0%{opacity:0;transform:translateY(0)}20%{opacity:.5}80%{opacity:.12}100%{opacity:0;transform:translateY(-26px)}}

    .pl{position:absolute;z-index:7;transition:left .5s ease,top .5s ease;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
    .pl.walking .girl-body{animation:walkBob .3s ease-in-out infinite}
    @keyframes walkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .girl-svg{width:46px;height:70px}

    .ro{position:absolute;z-index:6;cursor:pointer;transition:transform .2s,filter .2s}
    .ro:hover{transform:scale(1.12) translateY(-3px);filter:brightness(1.2)}.ro:active{transform:scale(.9)}
    .oic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.3);transition:all .3s;position:relative;overflow:hidden}
    .oic::after{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.04),transparent 50%);pointer-events:none}
    .ro:hover .oic{box-shadow:0 5px 16px rgba(0,0,0,.4)}
    .olb{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--mt);white-space:nowrap;background:rgba(5,10,15,.7);padding:1px 5px;border-radius:3px;pointer-events:none;font-weight:700}
    .ro.col{display:none}.ro.hid{display:none}.ro.rev{display:block;animation:orv .4s ease}
    @keyframes orv{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
    .ro.rattle .oic{animation:ratl .4s ease}
    @keyframes ratl{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

    .ecto{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(0,230,118,.25);box-shadow:0 0 10px rgba(0,230,118,.18);z-index:9;pointer-events:none;animation:ecta 1.3s ease forwards}
    @keyframes ecta{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-18px)}}
    .dring{position:absolute;border:2px solid var(--gd);border-radius:50%;z-index:14;pointer-events:none;animation:drng 1s ease forwards}
    @keyframes drng{0%{opacity:1;width:10px;height:10px}100%{opacity:0;width:120px;height:120px}}

    .inv{width:100%;min-height:58px;padding:5px 10px;background:rgba(5,10,15,.88);border-top:1px solid rgba(255,255,255,.03);display:flex;align-items:center;gap:5px;flex-shrink:0;z-index:20;overflow-x:auto}
    .invl{font-size:10px;color:var(--mt);white-space:nowrap;margin-left:4px}
    .islt{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--cd);border:2px solid var(--bd);cursor:pointer;transition:all .2s;flex-shrink:0;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.2)}
    .islt:hover{border-color:var(--ac);transform:scale(1.06)}.islt.sel{border-color:var(--ac);background:rgba(0,230,118,.04);box-shadow:0 0 12px rgba(0,230,118,.15)}
    .isn{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--mt);white-space:nowrap}
    .ie{color:var(--mt);font-size:10px;opacity:.2}

    .dlg{position:absolute;z-index:18;background:rgba(8,14,24,.9);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;max-width:70%;font-size:12px;line-height:1.6;text-align:center;animation:dlgI .3s ease;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
    @keyframes dlgI{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    .tbc{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:4px;align-items:center;max-width:95vw}
    .tst{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:6px 13px;font-size:11px;animation:tstI .3s ease;text-align:center;max-width:92vw}
    .tst.disc{border-color:var(--gd);background:rgba(255,215,64,.04);color:var(--gd);font-weight:700;box-shadow:0 0 18px rgba(255,215,64,.05)}
    .tst.ok{border-color:var(--ac);background:rgba(0,230,118,.04);color:var(--ac)}
    .tst.err{border-color:var(--dn);background:rgba(255,23,68,.03);color:var(--dn)}
    @keyframes tstI{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

    .fxfl{position:absolute;inset:0;z-index:14;pointer-events:none;animation:fxflA .5s ease forwards}
    @keyframes fxflA{0%{background:rgba(255,215,64,.08)}50%{background:rgba(255,215,64,.02)}100%{background:transparent}}
    .fxw{position:absolute;inset:0;z-index:14;pointer-events:none;animation:fxwA 1s ease forwards}
    @keyframes fxwA{0%{background:rgba(0,230,118,.06)}50%{background:rgba(0,230,118,.02)}100%{background:transparent}}
    .sshk{animation:shkA .35s ease}
    @keyframes shkA{0%,100%{transform:translate(0)}25%{transform:translate(-3px,3px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-3px,3px)}}
    .bglw{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,59,.14),transparent 70%);pointer-events:none;z-index:5;animation:bglwA 1.5s ease-in-out infinite}
    @keyframes bglwA{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
    .candle-glow{position:absolute;z-index:4;pointer-events:none;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,30,.04),transparent 70%);animation:cglow 2s ease-in-out infinite alternate}
    @keyframes cglow{0%{opacity:.6;transform:scale(1)}100%{opacity:1;transform:scale(1.1)}}
    .cobweb{position:absolute;z-index:4;pointer-events:none;opacity:.05}

    #lc,#gc{background:var(--bg);padding:20px}
    .lcb,.gcb{background:var(--cd);border-radius:16px;padding:28px;max-width:400px;width:92%;text-align:center}
    .lcb{border:1px solid rgba(0,230,118,.2);box-shadow:0 0 24px rgba(0,230,118,.04)}
    .gcb{border:1px solid rgba(0,230,118,.3);box-shadow:0 0 32px rgba(0,230,118,.06)}
    .lct{font-size:22px;font-weight:900;color:var(--ac);margin-bottom:5px}
    .lcw{font-size:13px;color:var(--gd);margin:6px 0}
    .lcd{color:var(--mt);font-size:11px;line-height:1.7;margin-bottom:16px}
    .gct{font-size:24px;font-weight:900;color:var(--ac);margin-bottom:6px}
    .gcg{display:flex;justify-content:center;gap:10px;margin:12px 0;flex-wrap:wrap}
    .gci{background:rgba(0,0,0,.3);border-radius:10px;padding:8px;font-size:10px;color:var(--mt);min-width:70px}
    .gci .gn{font-weight:700;display:block;margin-bottom:2px}
    .gci .gf{color:var(--gd);font-size:9px}

    @media(max-width:500px){.oic{width:40px;height:40px;font-size:16px}.ge .gchar-lg{width:56px;height:78px}.ge .ghead-lg{width:48px;height:42px}.ge .geye-lg{width:8px;height:9px;top:12px}.girl-svg{width:38px;height:58px}.islt{width:34px;height:34px;font-size:14px}.menu-ghost-svg{width:110px;height:138px}}
  </style>
</head>
<body>

<div id="menu" class="scr on">
  <div class="menu-bg">
    <div class="mpc" id="mpc"></div>
  </div>
  <div class="menu-content">
    <div class="menu-ghost-wrap" id="menuGhost"></div>
    <div class="menu-title-en">THE GHOST WHO'S<br>AFRAID OF YOU</div>
    <div class="menu-title-ar">الشبح اللي بيخاف منك</div>
    <div class="menu-btns">
      <button class="btn bp" id="playBtn"><i class="fas fa-play"></i>&nbsp; ابدئي اللعبة</button>
      <button class="btn bs" id="howBtn"><i class="fas fa-question-circle"></i>&nbsp; إزاي تلعبي؟</button>

function dropEcto(){var rm=document.getElementById("room");for(var i=0;i<5;i++){var e=document.createElement("div");e.className="ecto";e.style.left=(G.gP.x+Math.random()*12-6)+"%";e.style.top=(G.gP.y+Math.random()*10-2)+"%";e.style.animationDelay=(i*.1)+"s";rm.appendChild(e);(function(el){setTimeout(function(){el.remove()},1300)})(e)}}

function ghostFled(){var l=LV[G.lv];G.gone=true;setM("fleeing");S.wn();moveG(92,58);setTimeout(function(){var g=document.getElementById("gh");if(g)g.classList.add("gone")},450);var rm=document.getElementById("room"),fx=document.createElement("div");fx.className="fxw";rm.appendChild(fx);setTimeout(function(){fx.remove()},1000);toast(l.st,"ok");setTimeout(showLC,2400)}

function showLC(){var l=LV[G.lv],ic=IC[l.g.wid]||{i:"fa-circle",c:"#888"},b=document.getElementById("lcb");b.innerHTML='<div class="lct">مبروك!</div><div style="font-size:40px;color:'+ic.c+';margin:8px 0;opacity:.7"><i class="fa-solid '+ic.i+'"></i></div><div class="lcw">'+l.g.n+" بيخاف من "+l.g.wn+'</div><div class="lcd">'+l.st+'</div><button class="btn bp" id="nxtBtn"><i class="fas fa-forward"></i>&nbsp; '+(G.lv<LV.length-1?"التالي":"النتيجة")+"</button>";showScr("lc");document.getElementById("nxtBtn").addEventListener("click",nxt)}
function nxt(){if(G.lv<LV.length-1){G.lv++;stopAI();stopWhisp();stopTrail();showIntro()}else showGC()}
function showGC(){stopAI();stopWhisp();stopTrail();var b=document.getElementById("gcb"),gh="";for(var i=0;i<LV.length;i++){var l=LV[i],ic=IC[l.g.wid]||{i:"fa-circle",c:"#888"};gh+='<div class="gci"><i class="fa-solid '+ic.i+'" style="color:'+ic.c+';font-size:20px;display:block;margin-bottom:3px;opacity:.7"></i><span class="gn">'+l.g.n+'</span><div class="gf">بيخاف من '+l.g.wn+"</div></div>"}b.innerHTML='<div class="gct">كسبتي!</div><div style="color:var(--mt);font-size:11px;margin-bottom:6px">كل الأشباح اترعبت منك</div><div class="gcg">'+gh+'</div><button class="btn bp" id="rpBtn" style="margin-top:12px"><i class="fas fa-redo"></i>&nbsp; تاني</button>';showScr("gc");S.wn();document.getElementById("rpBtn").addEventListener("click",startGame)}

function startAI(){stopAI();G.gI=setInterval(aiT,2200)}
function stopAI(){if(G.gI){clearInterval(G.gI);G.gI=null}}
function stopWhisp(){if(G.wI){clearInterval(G.wI);G.wI=null}}
function aiT(){if(G.gone||G.mood==="fleeing")return;var nx,ny;if(G.fear>60){var dx=G.gP.x-G.pP.x,dy=G.gP.y-G.pP.y,d=Math.sqrt(dx*dx+dy*dy)||1;nx=G.gP.x+(dx/d)*22+(Math.random()-.5)*14;ny=G.gP.y+(dy/d)*18+(Math.random()-.5)*10}else if(G.fear>0){nx=G.gP.x+(Math.random()-.5)*20;ny=G.gP.y+(Math.random()-.5)*14}else{nx=G.gP.x+(Math.random()-.5)*30;ny=G.gP.y+(Math.random()-.5)*20}nx=Math.min(88,Math.max(8,nx));ny=Math.min(68,Math.max(8,ny));moveG(nx,ny);if(Math.random()<.1)S.wo()}

function moveG(x,y){G.gP={x:x,y:y};var g=document.getElementById("gh");if(g){g.style.left=x+"%";g.style.top=y+"%"}}
function moveGA(){var dx=G.gP.x-G.pP.x,dy=G.gP.y-G.pP.y,d=Math.sqrt(dx*dx+dy*dy)||1;moveG(Math.min(88,Math.max(8,G.gP.x+(dx/d)*28)),Math.min(68,Math.max(8,G.gP.y+(dy/d)*22)))}
function setM(m){G.mood=m;var g=document.getElementById("gh");if(!g)return;g.classList.remove("scared","amused","annoyed","fleeing");if(m==="scared")g.classList.add("scared");else if(m==="amused")g.classList.add("amused");else if(m==="annoyed")g.classList.add("annoyed");else if(m==="fleeing")g.classList.add("fleeing")}
function showDlg(t){var rm=document.getElementById("room");var old=rm.querySelectorAll(".dlg");for(var i=0;i<old.length;i++)old[i].remove();clearTimeout(G.dTO);var d=document.createElement("div");d.className="dlg";d.textContent=t;d.style.bottom="78px";d.style.left="50%";d.style.transform="translateX(-50%)";rm.appendChild(d);G.dTO=setTimeout(function(){d.remove()},3000)}
function toast(t,tp){tp=tp||"";var c=document.getElementById("tbc"),e=document.createElement("div");e.className="tst "+tp;e.textContent=t;c.appendChild(e);setTimeout(function(){e.style.opacity="0";e.style.transition="opacity .3s";setTimeout(function(){e.remove()},300)},tp==="disc"?3800:2400)}

document.getElementById("playBtn").addEventListener("click",startGame);
document.getElementById("howBtn").addEventListener("click",showHowTo);
document.getElementById("sbtn").addEventListener("click",function(){S.ut=!S.ut;if(S.mg)S.mg.gain.value=S.ut?0:.3;var b=document.getElementById("sbtn");b.innerHTML=S.ut?'<i class="fas fa-volume-xmark"></i>':'<i class="fas fa-volume-up"></i>'});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){G.sel=null;renderI()}});
</script>
</body>
</html>
